<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Workout Quest"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><title>Workout Quest</title><style>
:root{--bg:#0b1020;--card:#151c2f;--card2:#1b243b;--text:#f5f7fb;--muted:#9aa6bd;--accent:#7ee787;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:620px;margin:auto;padding:22px 16px 40px}.hero{text-align:center;padding:12px 0 18px}.sword{font-size:34px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:700}.title{font-size:30px;font-weight:900;margin:4px 0}.subtitle{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.panel{background:rgba(21,28,47,.94);border:1px solid #26314b;border-radius:16px;padding:14px}.stat{text-align:center}.num{font-size:25px;font-weight:900}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.xp{margin-top:12px}.bar{height:10px;background:#27324a;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0%;transition:.25s}.xptext{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}.tabs{display:flex;gap:7px;overflow:auto;padding:16px 0 10px;scrollbar-width:none}.tabs button{flex:0 0 auto;border:1px solid #2b3854;background:#141b2d;color:#b9c4d8;border-radius:12px;padding:9px 13px;font-weight:800}.tabs button.active{background:var(--accent);color:#08110b;border-color:var(--accent)}.daytop{display:flex;justify-content:space-between;align-items:start;gap:10px}.daytop h2{margin:0;font-size:21px}.tag{font-size:11px;color:var(--gold);font-weight:800}.exercise{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #26314b}.exercise:last-child{border-bottom:0}.exercise input{width:22px;height:22px;accent-color:var(--accent)}.ename{font-weight:750}.reps{color:var(--muted);font-size:13px;margin-top:2px}.actions{display:flex;gap:9px;margin-top:14px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.complete{background:var(--accent);color:#071009;flex:1}.reset{background:#29344c;color:#d8dfeb}.message{margin-top:12px;color:var(--gold);font-weight:750;min-height:20px}h3{margin:20px 0 10px}.badges{display:grid;grid-template-columns:1fr 1fr;gap:9px}.badge{background:#151c2f;border:1px solid #26314b;border-radius:14px;padding:12px}.badge.locked{opacity:.42}.badge strong{display:block}.badge span{font-size:12px;color:var(--muted)}footer{text-align:center;color:#66738b;font-size:11px;margin-top:25px}
</style></head><body><main><section class="hero"><div class="sword">⚔️</div><div class="eyebrow">YOUR PERSONAL FITNESS RPG</div><div class="title">Workout Quest</div><div class="subtitle">Train. Complete quests. Gain XP.</div></section><section class="stats"><div class="stat"><div class="num" id="level">1</div><div class="label">Level</div></div><div class="stat"><div class="num" id="xp">0</div><div class="label">XP</div></div><div class="stat"><div class="num" id="streak">0</div><div class="label">Streak</div></div></section><section class="xp panel"><div class="xptext"><span id="xplabel">0 / 500 XP</span><span id="weeklabel">0 / 6 this week</span></div><div class="bar"><div class="fill" id="xpfill"></div></div></section><div class="tabs" id="tabs"></div><section class="panel" id="quest"></section><h3>Achievements</h3><section class="badges" id="badges"></section><footer>Progress is saved on this device.</footer></main><script>
const days=[
{name:"Monday",title:"Full Body A",ex:[["Squats","12–15"],["Push-ups","6–12"],["Glute bridges","15"],["Plank","30 sec"],["Mountain climbers","20 total"]]},
{name:"Tuesday",title:"Legs + Abs",ex:[["Bodyweight squats","15"],["Reverse lunges","8 each leg"],["Glute bridges","15"],["Calf raises","20"],["Bicycle crunches","20 total"],["Plank","30–45 sec"]]},
{name:"Wednesday",title:"Upper Body",ex:[["Push-ups","6–12"],["Pike push-ups","6–10"],["Diamond/knee diamond push-ups","5–10"],["Superman","12–15"],["Plank shoulder taps","20 total"]]},
{name:"Thursday",title:"Legs + Core",ex:[["Reverse lunges","10 each leg"],["Squat pulses","15"],["Single-leg glute bridge","8 each leg"],["Calf raises","20"],["Dead bugs","10 each side"],["Mountain climbers","20–30 total"]]},
{name:"Friday",title:"Full Body B",ex:[["Squat → calf raise","12–15"],["Push-ups","6–12"],["Alternating lunges","10 each leg"],["Superman","12–15"],["Mountain climbers","20–30 total"],["Plank","30 sec"]]},
{name:"Saturday",title:"Conditioning",ex:[["High knees","30 sec"],["Bodyweight squats","30 sec"],["Mountain climbers","30 sec"],["Alternating reverse lunges","30 sec"],["Push-ups","30 sec"],["Plank","30 sec"]]},
{name:"Sunday",title:"Recovery Day",ex:[]}
];
const $=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem("workoutQuest")||'{"xp":0,"streak":0,"done":{},"completedDates":{}}');
if(!state.completedDates)state.completedDates={};if(!state.exerciseDone)state.exerciseDone={};let selected=Number(localStorage.getItem("wqDay")||0);function save(){localStorage.setItem("workoutQuest",JSON.stringify(state));localStorage.setItem("wqDay",selected)}function weekDone(){return days.slice(0,6).filter((_,i)=>state.done[i]).length}function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function updateStreak(){
  const dates=Object.keys(state.completedDates).sort();
  if(!dates.length){
    state.streak=0;
    return;
  }

  const today=new Date(todayKey());
  const latest=new Date(dates[dates.length-1]);
  const diff=Math.round((today-latest)/86400000);

  if(diff>1){
    state.streak=0;
  }
}function renderTabs(){$("tabs").innerHTML=days.map((d,i)=>`<button class="${i===selected?'active':''}" onclick="selectDay(${i})">${d.name.slice(0,3)}</button>`).join("")}function renderQuest(){
  const d=days[selected],done=!!state.done[selected];

  if(!state.exerciseDone)state.exerciseDone={};
  if(!state.exerciseDone[selected])state.exerciseDone[selected]={};

  if(selected===6){
    $("quest").innerHTML=`<div class="daytop"><div><div class="tag">SUNDAY</div><h2>Recovery Day 🌿</h2></div></div><p style="color:var(--muted);line-height:1.5">Rest is part of the quest. Stretch, walk, hydrate, and let your body recover.</p><div class="message">✨ No XP required today. You still showed up.</div>`;
    return;
  }

  $("quest").innerHTML=`<div class="daytop"><div><div class="tag">${d.name.toUpperCase()}</div><h2>${d.title}</h2></div><div class="tag">${done?'QUEST COMPLETE':'QUEST READY'}</div></div>${d.ex.map((e,i)=>`<label class="exercise"><input type="checkbox" ${state.exerciseDone[selected][i]?'checked':''} onchange="toggleExercise(${selected},${i},this.checked)"><div><div class="ename">${e[0]}</div><div class="reps">${e[1]}</div></div></label>`).join("")}<div class="actions"><button class="btn complete" onclick="completeQuest()">⚔️ Complete Quest</button><button class="btn reset" onclick="resetDay()">Reset</button></div><div class="message">${done?'Quest complete! +125 XP earned.':''}</div>`;function toggleExercise(day,exercise,checked){
  if(!state.exerciseDone)state.exerciseDone={};
  if(!state.exerciseDone[day])state.exerciseDone[day]={};

  state.exerciseDone[day][exercise]=checked;
  save();
}
}function renderStats(){const level=Math.floor(state.xp/500)+1,into=state.xp%500;$("level").textContent=level;$("xp").textContent=state.xp;$("streak").textContent=state.streak;$("xplabel").textContent=`${into} / 500 XP`;$("weeklabel").textContent=`${weekDone()} / 6 this week`;$("xpfill").style.width=(into/500*100)+"%"}function renderBadges(){const b=[["First Blood","Complete your first quest.",state.xp>=125],["Three’s a Charm","Complete 3 quests.",weekDone()>=3],["Getting Stronger","Reach 500 XP.",state.xp>=500],["Cardio Goblin","Complete Saturday.",!!state.done[5]],["Leg Day Survivor","Complete Tuesday or Thursday.",!!state.done[1]||!!state.done[3]],["Full Party","Complete all 6 training days.",weekDone()>=6],["The First Month","Reach 2000 XP.",state.xp>=2000],["Level 10","Reach Level 10.",state.xp>=4500]];$("badges").innerHTML=b.map(x=>`<div class="badge ${x[2]?'':'locked'}"><strong>${x[2]?'🏆':'🔒'} ${x[0]}</strong><span>${x[1]}</span></div>`).join("")}function render(){renderTabs();renderQuest();renderStats();renderBadges();save()}function selectDay(i){selected=i;render()}function completeQuest(){
  if(selected===6)return;

  if(state.done[selected]){
    $("quest").querySelector(".message").textContent="Already completed — nice work! 💪";
    return;
  }

  const today=todayKey();
  state.done[selected]=true;
  state.completedDates[today]=true;
  state.xp+=125;

  updateStreak();

  const dates=Object.keys(state.completedDates).sort();
  if(dates.length===1){
    state.streak=1;
  }else{
    const latest=new Date(dates[dates.length-1]);
    const previous=new Date(dates[dates.length-2]);
    let diff=Math.round((latest-previous)/86400000);

    if(diff===1){
      state.streak+=1;
    }else if(diff===2 && latest.getDay()===1){
      state.streak+=1;
    }else{
      state.streak=1;
    }
  }

  render();
}function resetDay(){
  if(state.done[selected]){
    delete state.done[selected];
    state.xp=Math.max(0,state.xp-125);

    const today=todayKey();
    delete state.completedDates[today];

    const dates=Object.keys(state.completedDates).sort();
    state.streak=0;

    if(dates.length){
      let count=1;

      for(let i=dates.length-1;i>0;i--){
        const a=new Date(dates[i]);
        const b=new Date(dates[i-1]);
        const diff=Math.round((a-b)/86400000);

        if(diff===1){
          count++;
        }else if(diff===2 && a.getDay()===1){
          count++;
        }else{
          break;
        }
      }

      state.streak=count;
    }
  }

  render();
}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
